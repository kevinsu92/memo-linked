# /etc/nginx/conf.d/ 에 설치한다. http 컨텍스트에서만 선언할 수 있는 항목들.

# 읽기: 초당 4회 (버스트 40). 사람이 쓰기에는 넉넉하고 크롤러는 걸린다.
limit_req_zone $binary_remote_addr zone=memo_read:10m rate=4r/s;

# 쓰기: 분당 20회. 자동화된 대량 작성·삭제를 막는다.
limit_req_zone $binary_remote_addr zone=memo_write:10m rate=20r/m;

# 동시 연결 수 제한.
limit_conn_zone $binary_remote_addr zone=memo_conn:10m;
