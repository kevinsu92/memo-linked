# nginx 리버스 프록시 설정 템플릿.
# deploy.sh 가 DOMAIN_PLACEHOLDER 를 실제 도메인으로 바꿔 넣는다.
#
# 인증서는 certbot certonly 가 따로 발급하고, 이 파일이 그것을 참조한다.
# certbot 이 이 파일을 수정하지 않으므로 재배포로 HTTPS 설정이 지워지지 않는다.

# 레이트 리밋 구역. http 컨텍스트에 있어야 해서 별도 파일로 분리한다.
# (deploy/nginx-limits.conf 참고)

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER;

    # 인증서 발급·갱신용 경로만 열어 두고 나머지는 HTTPS 로 보낸다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMAIN_PLACEHOLDER;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    # Flask 는 .js 를 text/javascript 로 내보내므로 두 표기를 모두 넣는다.
    gzip_types application/json application/javascript text/javascript
               text/css text/plain text/xml image/svg+xml;

    # 보안 헤더는 별도 파일로 두고 모든 location 에서 include 한다.
    # nginx 는 하위 블록에 add_header 가 하나라도 있으면 상위 것을 전부 무시하므로,
    # location 마다 명시적으로 넣어야 헤더가 조용히 사라지지 않는다.
    include /etc/nginx/snippets/memo-headers.conf;

    # 정적 파일은 nginx 가 디스크에서 바로 준다.
    # gunicorn 워커(2 x 4스레드)를 정적 파일 서빙에 쓰지 않기 위해서다.
    location /static/ {
        include /etc/nginx/snippets/memo-headers.conf;
        alias /home/ubuntu/memo/static/;
        expires 7d;
        access_log off;
        limit_conn memo_conn 20;
        try_files $uri =404;
    }

    # 헬스 체크는 서버 안에서만 볼 수 있게 한다.
    location = /healthz {
        include /etc/nginx/snippets/memo-headers.conf;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        access_log off;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    # 쓰기 계열은 훨씬 강하게 제한한다.
    # /memo 자체(저장)도 반드시 포함해야 한다. 빠뜨리면 저장만 읽기 제한을 타
    # 사실상 분당 240회까지 열린다.
    location ~ ^/memo(/(update|delete|restore|like|pin|share|capsule|revision/restore))?$ {
        include /etc/nginx/snippets/memo-headers.conf;
        limit_req zone=memo_write burst=10 nodelay;
        limit_conn memo_conn 10;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
    }

    location / {
        include /etc/nginx/snippets/memo-headers.conf;
        limit_req zone=memo_read burst=40 nodelay;
        limit_conn memo_conn 20;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
    }
}
