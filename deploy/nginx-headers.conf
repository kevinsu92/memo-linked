# /etc/nginx/snippets/memo-headers.conf 로 설치한다.
# 모든 location 에서 include 해야 헤더가 빠지지 않는다.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# nip.io 는 여러 사용자가 공유하는 도메인이라 includeSubDomains / preload 는 넣지 않는다.
add_header Strict-Transport-Security "max-age=31536000" always;

# 인라인 스크립트와 인라인 스타일을 쓰지 않으므로 'unsafe-inline' 없이 갈 수 있다.
# frame-ancestors 가 X-Frame-Options 를 대체한다.
add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
